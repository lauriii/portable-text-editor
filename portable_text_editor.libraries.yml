editor:
  # The bundle's own version, not core's: it is committed and changes on its
  # own schedule, and the URL a browser caches is built from this. Bump it
  # whenever js/portable-text-editor.js is rebuilt, or browsers will keep
  # serving the bundle they already have.
  version: 1.3.0
  js:
    js/portable-text-editor.js: { preprocess: false, minified: true }
  css:
    theme:
      css/portable-text-editor.css: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
    # The media library is opened as a Drupal modal, over AJAX, and reports
    # its choice through a jQuery event.
    - core/jquery
    - core/drupal.ajax
    - core/drupal.dialog.ajax
    # Provides the AJAX command the media library answers with.
    - editor/drupal.editor.dialog
